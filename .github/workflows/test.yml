name: CI Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: esign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: bun install

      - name: Generate Prisma Client
        working-directory: ./backend
        run: bunx prisma generate

      - name: Run Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/esign_test?sslmode=disable"
          GMAIL_USER: "test@gmail.com"
          GMAIL_PASS: "test-pass"
        run: bun test
